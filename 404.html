<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendusty Orbit — Intelligent Routing</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script>
    (function() {
      try {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Normalize path: strip .html and trailing slashes
        var clean = path.replace(/\/index\.html$/, '/').replace(/\.html$/, '');
        if (clean.length > 1 && clean.endsWith('/')) {
          clean = clean.slice(0, -1);
        }

        if (clean.indexOf('/share/shared') !== -1) {
          var code = clean.split('/share/shared/')[1] || '';
          if (code) {
            code = code.replace(/[()"' ]/g, '');
            window.location.replace('/share/shared/?code=' + encodeURIComponent(code) + hash);
          } else {
            window.location.replace('/share/shared/' + search + hash);
          }
          return;
        }
        if (clean === '/share') {
          window.location.replace('/share/' + search + hash);
          return;
        }

        if (/index-([a-zA-Z0-9_-]+)$/i.test(clean) || /download-([a-zA-Z0-9_-]+)$/i.test(clean)) {
          window.location.replace(clean + '.html' + search + hash);
          return;
        }

        var routeMap = {
          '/languages': '/languages/',
          '/languages/': '/languages/index.html',
          '': '/home/',
          '/': '/home/',
          '/home': '/home/',
          '/progress': '/progress/',
          '/download': '/windows/download/',
          '/windows/download': '/windows/download/',
          '/cursor-download': '/windows/cursor-download/',
          '/windows/cursor-download': '/windows/cursor-download/',
          '/echonode': '/echonode/',
          '/security': '/apps/account-manager/',
          '/admin': '/apps/account-manager/',
          '/apps/account-manager': '/apps/account-manager/'
        };

        if (routeMap.hasOwnProperty(clean)) {
          var target = routeMap[clean];
          if (target !== path && target !== clean && target !== path + '/') {
            window.location.replace(target + search + hash);
            return;
          }
        }
      } catch(e) {}
    })();
  </script>
  <style>
    body {
      background: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .glitch {
      font-size: 72px;
      font-weight: 800;
      color: #00f5b8;
      letter-spacing: -2px;
      margin: 0 0 10px 0;
      text-shadow: 0 0 20px rgba(0, 245, 184, 0.4);
    }
    h1 { font-size: 24px; margin: 0 0 12px 0; font-weight: 600; }
    p { color: #9ca3af; max-width: 420px; margin: 0 0 24px 0; line-height: 1.5; font-size: 15px; }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 245, 184, 0.1);
      border: 1px solid rgba(0, 245, 184, 0.4);
      color: #00f5b8;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    a.btn:hover {
      background: #00f5b8;
      color: #030712;
      box-shadow: 0 0 20px rgba(0, 245, 184, 0.5);
    }
  </style>
</head>
<body>
  <div class="glitch">404</div>
  <h1>Sector Coordinates Unresolved</h1>
  <p>The requested route has shifted or does not exist in the Trendusty Orbit network grid.</p>
  <a href="/home/" class="btn">&larr; Return to Trendusty Orbit COP</a>
  <script src="assets/orbit-animation-engine.js" defer></script>
</body>
</html>
