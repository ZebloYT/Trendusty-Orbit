<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="card-bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
    <linearGradient id="card-border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5b8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#card-bg-glow)" stroke="url(#card-border-glow)" stroke-width="3" />

  <!-- Inner Icon Content Scaled & Centered -->
  <g transform="translate(25.6, 25.6) scale(0.9)">
    <circle cx="256" cy="256" r="235" fill="url(#orbit-ambient-aura)" />

  <!-- Outer Radar Telemetry Grid Rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" stroke-dasharray="3 6" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(0, 245, 184, 0.28)" stroke-width="2" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" stroke-dasharray="12 12" />

  <!-- Precision Cardinal Radar Notches -->
  <g stroke-linecap="round" filter="url(#neon-glow)">
    <line x1="256" y1="18" x2="256" y2="38" stroke="#00f5b8" stroke-width="3.5" />
    <line x1="256" y1="474" x2="256" y2="494" stroke="#00f5b8" stroke-width="3.5" />
    <line x1="18" y1="256" x2="38" y2="256" stroke="#38bdf8" stroke-width="3.5" />
    <line x1="474" y1="256" x2="494" y2="256" stroke="#38bdf8" stroke-width="3.5" />
  </g>

  <!-- 45-Degree Radar Nodes -->
  <circle cx="95" cy="95" r="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="417" cy="95" r="3" fill="#00f5b8" opacity="0.8" />
  <circle cx="95" cy="417" r="3" fill="#00f5b8" opacity="0.8" />
  <circle cx="417" cy="417" r="3" fill="#38bdf8" opacity="0.8" />

  <!-- Relativistic Hyper-Orbit Ring 1: Back Arc (tilted -28 deg) -->
  <g transform="rotate(-28 256 256)">
    <path d="M 46 256 A 210 70 0 0 1 466 256" fill="none" stroke="rgba(129, 140, 248, 0.35)" stroke-width="3" stroke-dasharray="8 6" />
  </g>

  <!-- Relativistic Hyper-Orbit Ring 2: Back Arc (tilted +42 deg) -->
  <g transform="rotate(42 256 256)">
    <path d="M 66 256 A 190 62 0 0 1 446 256" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2.5" stroke-dasharray="6 6" />
  </g>

  <!-- Central Planetary Sphere Core -->
  <circle cx="256" cy="256" r="115" fill="url(#orbit-sphere-body)" stroke="url(#orbit-grad-primary)" stroke-width="3" filter="url(#neon-glow)" />
  <circle cx="256" cy="256" r="115" fill="url(#orbit-sphere-illumination)" />

  <!-- Planetary Orthogonal Grid / Cyber Coordinates -->
  <g opacity="0.6">
    <!-- Latitudes -->
    <ellipse cx="256" cy="256" rx="115" ry="32" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <ellipse cx="256" cy="216" rx="100" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" />
    <ellipse cx="256" cy="296" rx="100" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" />
    <ellipse cx="256" cy="180" rx="72" ry="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />
    <ellipse cx="256" cy="332" rx="72" ry="16" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Longitudes -->
    <ellipse cx="256" cy="256" rx="42" ry="115" fill="none" stroke="#00f5b8" stroke-width="1.8" />
    <ellipse cx="256" cy="256" rx="84" ry="115" fill="none" stroke="#00f5b8" stroke-width="1.2" stroke-dasharray="4 4" />
    <line x1="256" y1="141" x2="256" y2="371" stroke="#00f5b8" stroke-width="2" />
  </g>

  <!-- Relativistic Hyper-Orbit Ring 1: Front Sweep (Bright foreground glow) -->
  <g transform="rotate(-28 256 256)">
    <!-- Primary Glowing Beam -->
    <path d="M 46 256 A 210 70 0 0 0 466 256" fill="none" stroke="url(#orbit-grad-ring1)" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)" />
    <!-- Bright Laser Core Line -->
    <path d="M 46 256 A 210 70 0 0 0 466 256" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- Leading High-Tech Satellite Unit Alpha -->
    <g transform="translate(442, 276)">
      <!-- Outer Beacon Halo -->
      <circle cx="0" cy="0" r="9" fill="#00f5b8" opacity="0.4" filter="url(#neon-glow)" />
      <!-- Solid Node -->
      <circle cx="0" cy="0" r="4.5" fill="#00f5b8" />
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
      <!-- Satellite Photovoltaic Array Wings -->
      <line x1="-14" y1="0" x2="-6" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="6" y1="0" x2="14" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <!-- Antenna Probe -->
      <line x1="0" y1="-6" x2="0" y2="-11" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="0" cy="-11" r="1.5" fill="#38bdf8" />
    </g>

    <!-- Trailing Pulse Node -->
    <circle cx="160" cy="320" r="4" fill="#38bdf8" opacity="0.9" filter="url(#neon-glow)" />
    <circle cx="160" cy="320" r="1.8" fill="#ffffff" />
  </g>

  <!-- Relativistic Hyper-Orbit Ring 2: Front Sweep (tilted +42 deg) -->
  <g transform="rotate(42 256 256)">
    <path d="M 66 256 A 190 62 0 0 0 446 256" fill="none" stroke="url(#orbit-grad-ring2)" stroke-width="4.5" stroke-linecap="round" filter="url(#neon-glow)" />
    <path d="M 66 256 A 190 62 0 0 0 446 256" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

    <!-- Satellite Unit Beta -->
    <g transform="translate(90, 282)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8" opacity="0.5" filter="url(#neon-glow)" />
      <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
    </g>
  </g>

  <!-- Central Horizon Tactical Beacon Flare -->
  <g filter="url(#star-flare-glow)">
    <!-- 4-Point Diamond Flare Star -->
    <polygon points="256,232 262,250 280,256 262,262 256,280 250,262 232,256 250,250" fill="url(#orbit-grad-primary)" />
    <!-- White Hot Core Star -->
    <polygon points="256,240 259,253 272,256 259,259 256,272 253,259 240,256 253,253" fill="#ffffff" />
    <circle cx="256" cy="256" r="3.5" fill="#ffffff" />
  </g>

  <!-- Telemetry Coordinate Annotation -->
  <text x="256" y="398" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="3.5" text-anchor="middle" opacity="0.85">ORBIT // COP 360°</text>

  </g>
</svg>