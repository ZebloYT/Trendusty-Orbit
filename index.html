<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to Trendusty Orbit</title>
  <script>
    (function() {
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 850 && 'ontouchstart' in window);
      var forceDesktop = localStorage.getItem('orbit_force_desktop') === 'true' || window.location.search.indexOf('view=desktop') !== -1;
      var qs = window.location.search || '';
      if (isMobile && !forceDesktop) {
        window.location.replace("android/" + qs);
      } else {
        window.location.replace("home/" + qs);
      }
    })();
  </script>
</head>
<body class="custom-cursor-active">
  <p>Redirecting to <a href="home/">Trendusty Orbit Desktop</a> or <a href="android/">Android Phone Edition</a>...</p>
  <script src="assets/orbit-animation-engine.js" defer></script>
</body>
</html>
