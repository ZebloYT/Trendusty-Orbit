<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Cursors - Trendusty Orbit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #07090e;
    --bg-surface: #0c1017;
    --card-bg: rgba(13, 18, 28, 0.75);
    --glass-border: rgba(0, 245, 184, 0.16);
    --glass-border-hover: rgba(0, 245, 184, 0.45);
    --accent: #00f5b8;
    --accent-dim: rgba(0, 245, 184, 0.12);
    --text-main: #f0fdf4;
    --text-sub: rgba(240, 253, 244, 0.65);
    --primary-grad: linear-gradient(135deg, #00f5b8 0%, #00b4d8 100%);
    --secondary-bg: #0c1017;
    --border-color: rgba(0, 245, 184, 0.16);
  }
  
  /* TACTICAL ORBIT CURSOR - ADVANCED STATES */
  html, body, *, *::before, *::after { cursor: none !important; }
  a, button, input, textarea, select, canvas, [role="button"], label { cursor: none !important; }

  /* Precision Center Dot */
  .orbit-cursor-dot {
    position: fixed; top: 0; left: 0;
    width: 5px; height: 5px;
    background: #00f5b8; border-radius: 50%;
    pointer-events: none !important;
    z-index: 2147483647 !important;
    box-shadow: 0 0 12px rgba(0, 245, 184, 1), 0 0 4px #ffffff, 0 0 8px #000000;
    will-change: transform, width, height;
    opacity: 0;
    transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
    transition: width 0.4s cubic-bezier(0.25, 1, 0.25, 1), height 0.4s cubic-bezier(0.25, 1, 0.25, 1), background-color 0.4s ease, border-radius 0.4s ease, opacity 0.3s ease, box-shadow 0.4s ease, transform 0.08s ease;
  }

  /* Outer Ring */
  .orbit-cursor-ring {
    position: fixed; top: 0; left: 0;
    width: 56px; height: 56px;
    border: 1px solid rgba(0, 245, 184, 0.5);
    background: rgba(0, 245, 184, 0.03);
    border-radius: 50%;
    pointer-events: none !important;
    z-index: 2147483646 !important;
    box-shadow: 0 0 18px rgba(0, 245, 184, 0.3), 0 0 4px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(0, 245, 184, 0.1);
    will-change: transform, width, height;
    opacity: 0;
    transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
    transition: width 0.5s cubic-bezier(0.25, 1, 0.25, 1), height 0.5s cubic-bezier(0.25, 1, 0.25, 1), background-color 0.5s ease, border-color 0.5s ease, border-width 0.5s ease, box-shadow 0.5s ease, opacity 0.3s ease, border-radius 0.5s cubic-bezier(0.25, 1, 0.25, 1);
  }

  .orbit-cursor-ring::after {
    content: ""; position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    border-radius: 50%; border: 2px solid transparent;
    transition: border-top-color 0.3s ease, border-right-color 0.3s ease;
  }
  @keyframes orbit-spin { 100% { transform: rotate(360deg); } }

  /* --- STATES --- */
  .orbit-cursor-ring.is-hovering {
    width: 66px; height: 66px;
    border: 1.5px solid rgba(0, 245, 184, 0.65);
    background: rgba(0, 245, 184, 0.08);
    box-shadow: 0 0 26px rgba(0, 245, 184, 0.4), inset 0 0 14px rgba(0, 245, 184, 0.12);
  }
  .orbit-cursor-dot.is-hovering {
    background: #ffffff;
    box-shadow: 0 0 12px #00f5b8, 0 0 4px #ffffff;
    width: 8px; height: 8px;
  }
  .orbit-cursor-ring.is-text {
    width: 24px; height: 44px;
    border-radius: 6px;
    border: 1px solid rgba(0, 245, 184, 0.4);
    background: transparent; box-shadow: none;
  }
  .orbit-cursor-dot.is-text {
    width: 2px; height: 24px;
    border-radius: 1px;
    background: #00f5b8; box-shadow: 0 0 8px #00f5b8;
  }
  .orbit-cursor-ring.is-loading {
    width: 44px; height: 44px;
    border-color: rgba(0, 245, 184, 0.1);
    background: transparent; box-shadow: none;
  }
  .orbit-cursor-ring.is-loading::after {
    border-top-color: #00f5b8; border-right-color: rgba(0, 245, 184, 0.4);
    animation: orbit-spin 0.8s linear infinite;
  }
  .orbit-cursor-dot.is-loading {
    background: #00d2ff; box-shadow: 0 0 10px #00d2ff;
  }
  .orbit-cursor-ring.is-active {
    width: 28px; height: 28px;
    border: 1.5px solid #00d2ff;
    background: rgba(0, 210, 255, 0.25);
    box-shadow: 0 0 24px rgba(0, 210, 255, 0.8);
  }
  .orbit-cursor-dot.is-active {
    background: #00d2ff; box-shadow: 0 0 12px #00d2ff;
    width: 6px; height: 6px;
  }
  .mouse-trail-dot {
    position: fixed; width: 4px; height: 4px;
    background: #00f5b8; border-radius: 50%;
    pointer-events: none !important;
    z-index: 2147483645 !important;
    opacity: 0.8;
    transform: translate(-50%, -50%);
    transition: opacity 0.4s ease, transform 0.4s ease;
    box-shadow: 0 0 6px #00f5b8;
  }

  /* Custom Image Cursor */
  .custom-img-cursor {
    position: fixed; top: 0; left: 0; 
    width: 48px; height: 48px; 
    background-size: contain; background-repeat: no-repeat; 
    pointer-events: none !important; z-index: 2147483648 !important; 
    opacity: 0;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    display: none;
  }

  /* Page Styles */
  body { 
    font-family: 'Inter', sans-serif; 
    background-color: var(--bg-color); 
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 245, 184, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 10% 30%, rgba(0, 180, 216, 0.05) 0%, transparent 40%),
        linear-gradient(to bottom, #07090e, #05070a);
    background-attachment: fixed;
    color: var(--text-main); 
    margin: 0; 
    padding: 0; 
    overflow-x: hidden; 
  }
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-size: 48px 48px;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    pointer-events: none; z-index: -1;
  }
  
  .navbar {
    background: rgba(7, 9, 14, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-color);
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 40px;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  
  .nav-logo {
    font-size: 24px;
    font-weight: 800;
    background: var(--primary-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .nav-logo img { width: 30px; height: 30px; }
  
  .nav-links { margin-left: 40px; display: flex; gap: 20px; }
  .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 15px; transition: color 0.2s; }
  .nav-links a:hover { color: var(--accent); }

  .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
  
  .page-header { margin-bottom: 30px; }
  .page-header h1 { font-size: 32px; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.5px; }
  .page-header p { color: var(--text-sub); font-size: 16px; margin: 0; }
  
  .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
  
  .swz-card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    overflow: hidden;
    display: none; 
    border: 1px solid var(--border-color);
  }
  .swz-card.active-page { display: flex; flex-direction: column; }
  .swz-card:hover { transform: translateY(-6px); box-shadow: 0 15px 30px rgba(0, 245, 184, 0.15); border-color: var(--glass-border-hover); }
  
  .swz-card.selected-idle { border: 2px solid var(--accent); }
  .swz-card.selected-click { border: 2px solid #00b4d8; }
  .swz-card.selected-idle.selected-click { border: 2px solid #fff; }
  
  .swz-poster {
    width: 100%;
    aspect-ratio: 2/1;
    background: var(--bg-surface);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border-color);
  }
  
  .swz-default-view {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center; gap: 30px;
    transition: opacity 0.3s;
    z-index: 1;
  }
  .swz-big-icon {
    width: 72px; height: 72px;
    object-fit: contain;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
  }
  
  .swz-hover-gif {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 2;
  }
  .swz-card:hover .swz-default-view { opacity: 0; }
  .swz-card:hover .swz-hover-gif { opacity: 1; }
  
  .swz-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
  
  .swz-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 20px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--text-main);
  }
  
  .swz-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  
  .swz-icons { display: flex; gap: 10px; }
  .swz-icons img { width: 32px; height: 32px; object-fit: contain; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; }
  
  .swz-buttons { display: flex; gap: 8px; }
  .swz-btn {
    border: none;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    transition: 0.2s;
  }
  .swz-btn-idle { background: var(--primary-grad); color: #000; }
  .swz-btn-idle:hover { filter: brightness(1.2); box-shadow: 0 0 10px var(--accent-glow); }
  
  .swz-btn-click { background: var(--secondary-bg); color: var(--text-main); border: 1px solid var(--border-color); }
  .swz-btn-click:hover { background: rgba(255,255,255,0.1); border-color: var(--text-muted); }

  .pagination { display: flex; justify-content: center; gap: 8px; margin: 50px 0; flex-wrap: wrap; }
  .page-btn { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 16px; border-radius: 8px; font-size: 15px; font-weight: 600; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .page-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--glass-border-hover); }
  .page-btn.active { background: var(--primary-grad); color: #000; border-color: transparent; box-shadow: 0 0 15px var(--accent-glow); }
  
  .compiler-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(7, 9, 14, 0.9);
    backdrop-filter: blur(10px);
    padding: 15px 30px;
    border-radius: 50px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 1000;
    border: 1px solid var(--border-color);
  }
  
  .selection-info { display: flex; gap: 20px; font-size: 14px; font-weight: 600; color: var(--text-sub); }
  .selection-info span { color: var(--accent); margin-left: 5px; }
  
  .btn-install { background: var(--primary-grad); color: #000; border: none; padding: 12px 24px; font-size: 14px; font-weight: 800; border-radius: 25px; transition: 0.2s; }
  .btn-install:hover:not(:disabled) { filter: brightness(1.2); box-shadow: 0 0 15px var(--accent-glow); }
  .btn-install:disabled { background: var(--secondary-bg); color: var(--text-sub); border: 1px solid var(--border-color); box-shadow: none; }
</style>
</head>
<body>

<!-- Tactical Orbit Mouse Cursor (Dot + Bigger Lighter Follower Ring) -->
<div class="orbit-cursor-dot" id="orbit-cursor-dot" aria-hidden="true"></div>
<div class="orbit-cursor-ring" id="orbit-cursor-ring" aria-hidden="true"></div>
<!-- Custom Custom Cursor -->
<div class="custom-img-cursor" id="custom-img-cursor"></div>

<div class="navbar">
  <div class="nav-logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00f5b8" /><stop offset="100%" stop-color="#00b4d8" /></linearGradient></defs><path d="M4 4l16 16M4 20L20 4"/></svg>
    Custom Cursors
  </div>
  <div class="nav-links">
    <a href="../home/index.html">Orbit Dashboard</a>
    <a href="../progress.html">System Progress</a>
    <a href="#">Top Cursors</a>
    <a href="#">New Cursors</a>
  </div>
</div>

<div class="container">
  <div class="page-header">
    <h1>Custom Cursors</h1>
    <p>Select a custom cursor pack to enhance your interface experience.</p>
  </div>
  
  <div class="preview-grid" id="grid">
    
  </div>
  
  <div class="pagination" id="pagination"></div>
</div>

<div class="compiler-bar">
    <div class="selection-info">
        <div>Idle Arrow: <span id="lbl-idle">None</span></div>
        <div>Click Pointer: <span id="lbl-click">None</span></div>
    </div>
    <button class="btn-install" id="btn-install" disabled onclick="compileZip()">Download ZIP Pack</button>
</div>

<script>
  const fileData = {};
  
  const itemsPerPage = 48;
  const cards = document.querySelectorAll('.swz-card');
  const totalPages = Math.ceil(cards.length / itemsPerPage);
  let currentPage = 1;

  function showPage(page) {
    currentPage = page;
    const start = (page - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    
    cards.forEach((card, index) => {
      if (index >= start && index < end) {
        card.classList.add('active-page');
      } else {
        card.classList.remove('active-page');
      }
    });
    
    renderPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPagination() {
    const pagContainer = document.getElementById('pagination');
    pagContainer.innerHTML = '';
    if(totalPages <= 1) return;
    
    if (currentPage > 1) {
      const btn = document.createElement('button');
      btn.className = 'page-btn';
      btn.innerText = '« Prev';
      btn.onclick = () => showPage(currentPage - 1);
      pagContainer.appendChild(btn);
    }
    
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          const btn = document.createElement('button');
          btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
          btn.innerText = i;
          btn.onclick = () => showPage(i);
          pagContainer.appendChild(btn);
      } else if (i === currentPage - 3 || i === currentPage + 3) {
          const dots = document.createElement('span');
          dots.style.color = '#86868b';
          dots.style.padding = '10px';
          dots.innerText = '...';
          pagContainer.appendChild(dots);
      }
    }
    
    if (currentPage < totalPages) {
      const btn = document.createElement('button');
      btn.className = 'page-btn';
      btn.innerText = 'Next »';
      btn.onclick = () => showPage(currentPage + 1);
      pagContainer.appendChild(btn);
    }
  }
  
  showPage(1);

  let selectedIdlePath = "";
  let selectedClickPath = "";
  let currentIconUrl = "";
  let currentPointerUrl = "";

  function setCursor(type, name, path, btnElement) {
    const card = btnElement.closest('.swz-card');
    
    if (type === 'idle') {
        document.querySelectorAll('.selected-idle').forEach(el => el.classList.remove('selected-idle'));
        card.classList.add('selected-idle');
        selectedIdlePath = path;
        
        let truncated = name;
        if(name.length > 20) truncated = name.substring(0, 20) + '...';
        document.getElementById('lbl-idle').innerText = truncated;
        
        currentIconUrl = card.getAttribute('data-icon');
        updateDomCursorImage(currentIconUrl);
    } else {
        document.querySelectorAll('.selected-click').forEach(el => el.classList.remove('selected-click'));
        card.classList.add('selected-click');
        selectedClickPath = path;
        
        let truncated = name;
        if(name.length > 20) truncated = name.substring(0, 20) + '...';
        document.getElementById('lbl-click').innerText = truncated;
        
        currentPointerUrl = card.getAttribute('data-pointer');
    }
    
    if (selectedIdlePath !== "" && selectedClickPath !== "") {
        const btn = document.getElementById('btn-install');
        btn.disabled = false;
        btn.innerText = "Download Custom Pack";
    }
  }

  async function compileZip() {
    const btn = document.getElementById('btn-install');
    btn.innerText = "Building...";
    btn.disabled = true;

    try {
        const zip = new JSZip();
        const idleExt = selectedIdlePath.split('.').pop();
        const clickExt = selectedClickPath.split('.').pop();
        
        zip.file("idle_cursor." + idleExt, fileData[selectedIdlePath].cursor, {base64: true});
        zip.file("click_cursor." + clickExt, fileData[selectedClickPath].cursor, {base64: true});
        
        const batContent = `@echo off
color 0A
title Sweezy Custom Cursor Installer
echo ===================================================
echo      INSTALLING YOUR CUSTOM CURSOR SELECTION
echo ===================================================
echo.
set "TARGET_DIR=%LOCALAPPDATA%\MyCustomCursors"
mkdir "%TARGET_DIR%" 2>nul
copy /y "%~dp0idle_cursor.${idleExt}" "%TARGET_DIR%\idle_cursor.${idleExt}" >nul
copy /y "%~dp0click_cursor.${clickExt}" "%TARGET_DIR%\click_cursor.${clickExt}" >nul
reg add "HKCU\Control Panel\Cursors" /v Arrow /t REG_EXPAND_SZ /d "%TARGET_DIR%\idle_cursor.${idleExt}" /f
reg add "HKCU\Control Panel\Cursors" /v Hand /t REG_EXPAND_SZ /d "%TARGET_DIR%\click_cursor.${clickExt}" /f
RUNDLL32.EXE USER32.DLL,UpdatePerUserSystemParameters ,1 ,True
echo.
echo ===================================================
echo     INSTALLATION COMPLETE!
echo ===================================================
pause
`;
        zip.file("Install_Rename_Me_To_BAT.txt", batContent);
        
        const content = await zip.generateAsync({type:"blob"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "Custom_Cursor_Pack.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        btn.innerText = "Download Custom Pack";
        btn.disabled = false;
        
    } catch(e) {
        alert("Compilation failed.");
        btn.innerText = "Download Custom Pack";
        btn.disabled = false;
    }
  }

  // TACTICAL ORBIT CURSOR LOGIC + SWEEZY CURSOR LOGIC
  const dot = document.getElementById('orbit-cursor-dot');
  const ring = document.getElementById('orbit-cursor-ring');
  const customImg = document.getElementById('custom-img-cursor');
  
  let mouseX = -100, mouseY = -100;
  let ringX = -100, ringY = -100;
  let isVisible = false;
  let isMouseDown = false;
  let useSweezy = false;

  function updateDomCursorImage(url) {
    if(url) {
      useSweezy = true;
      dot.style.display = 'none';
      ring.style.display = 'none';
      customImg.style.display = 'block';
      customImg.style.backgroundImage = `url('${url}')`;
      trails.forEach(t => t.style.display = 'none');
    } else {
      useSweezy = false;
      dot.style.display = 'block';
      ring.style.display = 'block';
      customImg.style.display = 'none';
      trails.forEach(t => t.style.display = 'block');
    }
  }

  // Mouse Trail Logic
  const trails = [];
  const MAX_TRAILS = 12;
  let trailIndex = 0;
  for (let i = 0; i < MAX_TRAILS; i++) {
    const t = document.createElement('div');
    t.className = 'mouse-trail-dot';
    t.style.opacity = '0';
    document.body.appendChild(t);
    trails.push(t);
  }

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    
    if (!isVisible) {
      isVisible = true;
      if (!useSweezy) {
          dot.style.opacity = '1';
          ring.style.opacity = '1';
      }
      customImg.style.opacity = '1';
      ringX = mouseX;
      ringY = mouseY;
    }
    
    if (useSweezy) {
      customImg.style.left = mouseX + 'px'; 
      customImg.style.top = mouseY + 'px';
    } else {
      dot.style.transform = 'translate3d(' + mouseX + 'px, ' + mouseY + 'px, 0) translate(-50%, -50%)';
      
      const t = trails[trailIndex];
      t.style.left = mouseX + 'px';
      t.style.top = mouseY + 'px';
      t.style.opacity = '0.6';
      t.style.transform = 'translate(-50%, -50%) scale(1)';
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translate(-50%, -50%) scale(0.2)';
      }, 50);
      trailIndex = (trailIndex + 1) % MAX_TRAILS;
    }
  }, { passive: true });

  document.addEventListener('mousedown', (e) => {
    isMouseDown = true;
    ring.classList.add('is-active');
    dot.classList.add('is-active');
    
    if (useSweezy && currentPointerUrl) {
      customImg.style.backgroundImage = `url('${currentPointerUrl}')`;
    }
    
    const card = e.target.closest('.swz-card');
    if (card) {
        let hoverPointerUrl = card.getAttribute('data-pointer');
        if (hoverPointerUrl) {
            useSweezy = true;
            dot.style.display = 'none'; ring.style.display = 'none'; trails.forEach(t => t.style.display = 'none');
            customImg.style.display = 'block';
            customImg.style.backgroundImage = `url('${hoverPointerUrl}')`;
        }
    }
  });
  
  document.addEventListener('mouseup', (e) => {
    isMouseDown = false;
    ring.classList.remove('is-active');
    dot.classList.remove('is-active');
    
    const card = e.target.closest('.swz-card');
    if (card) {
        let hoverIconUrl = card.getAttribute('data-icon');
        if (hoverIconUrl) {
            customImg.style.backgroundImage = `url('${hoverIconUrl}')`;
        }
    } else if (useSweezy && currentIconUrl) {
        customImg.style.backgroundImage = `url('${currentIconUrl}')`;
    }
  });

  document.addEventListener('mouseleave', () => {
    isVisible = false;
    dot.style.opacity = '0';
    ring.style.opacity = '0';
    customImg.style.opacity = '0';
  });
  
  document.addEventListener('mouseenter', () => {
    isVisible = true;
    if (!useSweezy) {
        dot.style.opacity = '1';
        ring.style.opacity = '1';
    }
    customImg.style.opacity = '1';
  });

  function renderFollower() {
    if (isVisible && !useSweezy) {
      const ease = 0.18;
      ringX += (mouseX - ringX) * ease;
      ringY += (mouseY - ringY) * ease;
      ring.style.transform = 'translate3d(' + ringX + 'px, ' + ringY + 'px, 0) translate(-50%, -50%)';
    }
    requestAnimationFrame(renderFollower);
  }
  requestAnimationFrame(renderFollower);

  const interactiveSelector = 'button, a, .swz-btn, .page-btn, .btn-install, .swz-card';
  document.addEventListener('mouseover', (e) => {
    const el = e.target;
    if (!el || !el.closest) return;
    
    let isClickable = el.closest(interactiveSelector) !== null;
    let isText = el.closest('p, h1, span') !== null && !isClickable;
    
    ring.classList.remove('is-hovering', 'is-text');
    dot.classList.remove('is-hovering', 'is-text');
    if (isClickable) {
      ring.classList.add('is-hovering');
      dot.classList.add('is-hovering');
    } else if (isText) {
      ring.classList.add('is-text');
      dot.classList.add('is-text');
    }
    
    const card = el.closest('.swz-card');
    if (card) {
        let hoverIconUrl = card.getAttribute('data-icon');
        let hoverPointerUrl = card.getAttribute('data-pointer');
        
        if (isMouseDown || e.target.closest('.swz-btn')) {
           updateDomCursorImage(hoverPointerUrl || hoverIconUrl);
        } else if (hoverIconUrl) {
           updateDomCursorImage(hoverIconUrl);
        }
    } else {
        if (e.target.closest('.btn-install, .page-btn') && currentPointerUrl) {
           updateDomCursorImage(currentPointerUrl);
        } else if (currentIconUrl) {
           updateDomCursorImage(currentIconUrl);
        } else {
           updateDomCursorImage(""); 
        }
    }
  });
</script>
</body>
</html>
