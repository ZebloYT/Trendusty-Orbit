<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <filter id="anchor-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Concentric Target Anchor -->
  <circle cx="16" cy="16" r="14" fill="#070b14" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" filter="url(#anchor-glow)" />
  <circle cx="16" cy="16" r="9" stroke="#00f5b8" stroke-width="1.5" stroke-dasharray="3 2" />
  <circle cx="16" cy="16" r="3.5" fill="#00f5b8" filter="url(#anchor-glow)" />
  <circle cx="16" cy="16" r="1.5" fill="#ffffff" />
</svg>
