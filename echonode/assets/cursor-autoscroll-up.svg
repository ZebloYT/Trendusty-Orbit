<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <filter id="up-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="disc-up" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f5b8" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#070a12" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Background Disc -->
  <circle cx="24" cy="24" r="22" fill="url(#disc-up)" stroke="#00f5b8" stroke-width="2" filter="url(#up-glow)" />

  <!-- Center Dot -->
  <circle cx="24" cy="28" r="3" fill="#38bdf8" />

  <!-- Highlighted Glowing UP Arrow -->
  <path d="M16 16 L24 6 L32 16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#up-glow)" />
  <path d="M18 22 L24 14 L30 22" stroke="#00f5b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
